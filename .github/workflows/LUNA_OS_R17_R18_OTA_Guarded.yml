name: LUNA OS 9 - R17 R18 OTA guarded candidate
run-name: LUNA OS R17 R18 guarded ${{ inputs.mode }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Prepare GoFile upload helper
      if: inputs.mode == 'build' && inputs.delivery == 'gofile'
      env:
        GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lumacore-gofile-upload.sh" <<'LC_UPLOAD'
        #!/usr/bin/env bash
        set -euo pipefail
        umask 077
        file="$1"
        report="$2"
        : > "$report"
        [[ -n "${GOFILE_TOKEN:-}" && -n "${GOFILE_FOLDER_ID:-}" ]] || { echo 'Missing GOFILE_TOKEN or GOFILE_FOLDER_ID' | tee -a "$report"; exit 1; }
        [[ "$GOFILE_FOLDER_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]] || { echo 'GOFILE_FOLDER_ID must be the folder UUID, not the share code' | tee -a "$report"; exit 1; }
        [[ -s "$file" ]] || { echo 'Upload file missing or empty' | tee -a "$report"; exit 1; }
        response=$(mktemp)
        trap 'rm -f "$response"' EXIT
        # Do not follow redirects or send credentials to other domains. Do not print raw response.
        if ! http=$(curl --silent --show-error --proto '=https' --connect-timeout 30 --max-time 7200 \
            --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GOFILE_TOKEN" \
            --form-string "folderId=$GOFILE_FOLDER_ID" --form "file=@$file" \
            'https://upload.gofile.io/uploadfile'); then
          echo 'Transport error during GoFile.io upload; check your folder before retrying' | tee -a "$report"
          exit 1
        fi
        python3 - "$response" "$http" "$file" <<'PY_RESPONSE' | tee -a "$report"
        import json, sys, os, re, hashlib
        from pathlib import Path
        response, http, filename = sys.argv[1:]
        p = Path(filename)
        print('HTTP:', http)
        try:
            obj = json.loads(Path(response).read_text())
            status = obj.get('status', '')
        except (OSError, ValueError, AttributeError):
            raise SystemExit('GoFile response was not valid JSON; inspect account in browser')
        # Only report known-format status values; never dump raw responses or tokens.
        if not isinstance(status, str) or not re.fullmatch(r'(ok|error-[A-Za-z0-9_-]{1,64})', status):
            status = 'unrecognized'
        print('API status:', status)
        if not http.startswith('2') or status != 'ok':
            raise SystemExit('Upload rejected; check API status and account/folder settings')
        d = obj.get('data')
        if not isinstance(d, dict): raise SystemExit('Missing upload metadata')
        if d.get('name') != p.name: raise SystemExit('Returned filename mismatch')
        if str(d.get('size')) != str(p.stat().st_size): raise SystemExit('Returned file size mismatch or missing')
        if str(d.get('parentFolder','')).lower() != os.environ['GOFILE_FOLDER_ID'].lower():
            raise SystemExit('Returned parent folder mismatch or missing')
        remote_md5 = d.get('md5')
        if not isinstance(remote_md5, str) or not re.fullmatch(r'[a-fA-F0-9]{32}', remote_md5):
            raise SystemExit('Missing or invalid server MD5; upload not verified')
        with p.open('rb') as f: local_md5 = hashlib.file_digest(f, 'md5').hexdigest()
        if local_md5 != remote_md5.lower(): raise SystemExit('Server MD5 mismatch')
        print('File:', p.name)
        print('Bytes:', p.stat().st_size)
        print('MD5:', local_md5)
        print('UPLOAD_VERIFIED: server size and MD5 match local file')
        print('Open your configured folder in https://gofile.io/ ; link is not published in public logs.')
        PY_RESPONSE
        LC_UPLOAD
        [[ -n "${GOFILE_TOKEN:-}" && -n "${GOFILE_FOLDER_ID:-}" ]] || { echo "GoFile credentials missing"; exit 1; }
        [[ "$GOFILE_FOLDER_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]] || { echo "GoFile folder ID must be UUID"; exit 1; }
    - name: Checkout project
      uses: actions/checkout@v4
    - name: Checkout M14-compatible base engine (MIT)
      run: |
        git clone --depth 1 --branch 8.5 https://github.com/KrrishJaat/ReCoreUI.git /tmp/ReCoreUI
        git -C /tmp/ReCoreUI rev-parse HEAD | tee upstream-commit.txt
        test "$(cat upstream-commit.txt)" = 26f16143e83cd30a490ad06bd952d469327dabed
        cp /tmp/ReCoreUI/LICENSE upstream-LICENSE.txt
    - name: Install SDK37 engine stages and M14 configuration
      run: |
        python3 - <<'PY_PORT'
        #!/usr/bin/env python3
        """Apply a minimal, reviewable A17 One UI 9.0 donor conversion to ReCoreUI 8.5.

        This prepares an experimental build. It does NOT validate boot, AVB or IMS.
        Upstream project: https://github.com/KrrishJaat/ReCoreUI (MIT license).
        """
        from pathlib import Path
        import argparse
        import re
        import sys

        ENGINE = '#!/usr/bin/env python3\n"""LUNA OS SDK37 stage guard. Original code; MIT-compatible integration.\nNo HAL shims, signature bypass, APEX modification or security-service emulation.\n"""\nimport hashlib,json,re,sys,shutil,os,stat\nfrom pathlib import Path\n\nPARTS=(\'system\',\'system_ext\',\'product\',\'vendor\',\'odm\')\nNFC={\'NfcNci.apk\',\'SecNfc.apk\',\'libnfc_nci_jni.so\',\'libnfc_sec_jni.so\'}\nCRITICAL={\'libbluetooth_jni.so\',\'ssrm.jar\',\'com.android.bt.apex\',\'com.android.bt.capex\',\'com.android.nfc.apex\',\'com.android.nfc.capex\'}\ndef sha(p):\n    h=hashlib.sha256()\n    with p.open(\'rb\') as f:\n        for b in iter(lambda:f.read(1024*1024),b\'\'):h.update(b)\n    return h.hexdigest()\ndef prop(root,key):\n    vals=[]\n    for p in (root/\'build.prop\',root/\'system/build.prop\',root/\'etc/build.prop\'):\n        if p.is_file():\n            vals+=re.findall(r\'(?m)^\'+re.escape(key)+r\'=([^\\r\\n]+)\',p.read_text(errors=\'replace\'))\n    return sorted(set(vals))\ndef scan(roots):\n    out={}\n    for part,root in roots.items():\n        for d,dirs,files in os.walk(root,followlinks=False):\n            for name in files:\n                if name not in NFC|CRITICAL and not name.endswith((\'.apex\',\'.capex\')) and \'vaultkeeper\' not in name.lower():continue\n                p=Path(d)/name\n                if p.is_symlink() or not p.is_file():continue\n                rel=part+\'/\'+p.relative_to(root).as_posix()\n                out[rel]={\'sha256\':sha(p),\'size\':p.stat().st_size}\n    return out\n\ndef run(stage,state,roots):\n    sdk=prop(roots[\'system\'],\'ro.system.build.version.sdk\') or prop(roots[\'system\'],\'ro.build.version.sdk\')\n    if sdk!=[\'37\']:raise RuntimeError(\'Expected actual donor SDK 37, found \'+repr(sdk))\n    before=state/\'before.json\'; after=state/\'after.json\'; state.mkdir(parents=True,exist_ok=True)\n    inventory=scan(roots)\n    if stage==\'before\':\n        before.write_text(json.dumps({\'sdk\':sdk,\'files\':inventory},indent=2));return\n    base=json.loads(before.read_text())[\'files\']\n    # Android 17 packages must remain version-coherent. No copying SDK36 libraries.\n    # Report content changes, reject disappearance of original NFC/BT payloads or original APEX files.\n    missing=[p for p in base if p not in inventory]\n    modified=[p for p in base if p in inventory and base[p]!=inventory[p]]\n    lost=[p for p in missing if Path(p).name in NFC|CRITICAL or p.endswith((\'.apex\',\'.capex\'))]\n    changed_apex=[p for p in modified if p.endswith((\'.apex\',\'.capex\'))]\n    warnings=[]\n    if not any(Path(p).name==\'libnfc_nci_jni.so\' for p in inventory): warnings.append(\'NFC JNI not visible as loose file; inspect original APEX/APK contents and linker namespace before claiming NFC fixed\')\n    warnings+=[\'Bluetooth VaultKeeper HIDL/AIDL compatibility not established\',\'SSRM thermal policy not validated\',\'VINTF and device boot not validated\']\n    result={\'sdk\':sdk,\'missing\':missing,\'modified\':modified,\'added\':[p for p in inventory if p not in base],\'blocked_missing\':lost,\'blocked_apex_changes\':changed_apex,\'warnings\':warnings,\'status\':\'BLOCKED\' if lost or changed_apex else \'SDK37_STAGE_GUARD_PASS_NOT_DEVICE_VALIDATED\'}\n    after.write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2))\n    if lost or changed_apex:raise RuntimeError(\'Critical SDK37 payload removed or APEX modified; inspect report; do not bypass guard\')\n    # Brand only display label. Preserve build fingerprint, security patch, actual SDK and signing.\n    for p in (roots[\'system\']/\'build.prop\',roots[\'system\']/\'system/build.prop\'):\n        if p.is_file():\n            old=p.read_bytes();new,n=re.subn(rb\'(?m)^ro\\.build\\.display\\.id=[^\\r\\n]*\',b\'ro.build.display.id=LUNA OS 9.0 ALPHA\',old)\n            if n and old!=new:p.write_bytes(new)\n\ndef main():\n    if len(sys.argv)<4:raise SystemExit(\'usage: stage before|after state part=path ...\')\n    stage=sys.argv[1]; assert stage in (\'before\',\'after\');state=Path(sys.argv[2]);roots={}\n    for arg in sys.argv[3:]:\n        k,v=arg.split(\'=\',1);p=Path(v);assert k in PARTS and p.is_dir();roots[k]=p\n    if \'system\' not in roots:raise RuntimeError(\'Missing system tree\')\n    run(stage,state,roots)\nif __name__==\'__main__\':main()\n'
        HOOK = '#!/usr/bin/env bash\n# Sourced in the builder shell. Do not alter global shell options.\nlc_stage() {\n    local stage="$1" part root\n    local -a args=()\n    for part in system system_ext product vendor odm; do\n        if root=$(GET_PARTITION_PATH "$part" 2>/dev/null) && [[ -d "$root" ]]; then\n            args+=("$part=$root")\n        fi\n    done\n    python3 "$RECOREUI/lunaos-sdk37.py" "$stage" /tmp/lunaos-sdk37-state "${args[@]}"\n}\nlc_stage "$1"\n'
        DONOR = "A176BXXU8DZJ5/A176BOXM8DZJ5/A176BXXU8DZJ5/A176BXXU8DZJ5"
        STOCK = "M146BXXSFDZI1/M146BOJMFDZI1/M146BXXSFDZI1/M146BXXSFDZI1"

        # Use the M14's UNMODIFIED, model-matched boot chain rather than the
        # potentially root-enabled prebuilt boot images supplied by the port framework.
        KERNEL_SCRIPT = r'''#!/usr/bin/env bash
        # Experimental: take boot chain exclusively from the M14's stock AP package.
        # NOTE: stock vbmeta may reject the modified system. Do not flash until
        # AVB, kernel/system compatibility and rollback/recovery are audited.
        # This script is sourced by the ReCoreUI builder: do not change shell options.
        AP_DIR="${FW_BASE}/${STOCK_MODEL}_${STOCK_CSC}"
        AP="$(find "$AP_DIR" -maxdepth 1 -type f \( -name 'AP_*.tar.md5' -o -name 'AP_*.tar' \) -print -quit)"
        [[ -n "${AP:-}" && -s "$AP" ]] || { echo "Stock M14 AP archive missing"; return 1; }

        mkdir -p "$DIROUT"
        for PART in boot init_boot vendor_boot dtbo vbmeta; do
          ENTRY="$(tar -tf "$AP" | grep -E "(^|/)${PART}\.img\.lz4$" | head -n 1 || true)"
          [[ -n "$ENTRY" ]] || { echo "Missing ${PART}.img.lz4 in stock AP"; return 1; }
          TMP="$DIROUT/${PART}.img.tmp"
          rm -f "$TMP"
          if ! tar -xOf "$AP" "$ENTRY" | lz4 -dc > "$TMP"; then
            echo "Decompression failed: ${PART}.img"
            return 1
          fi
          [[ -s "$TMP" ]] || { echo "Empty ${PART}.img"; return 1; }
          mv -f "$TMP" "$DIROUT/${PART}.img"
          mkdir -p /tmp/lunaos-stock
          cp "$DIROUT/${PART}.img" /tmp/lunaos-stock/
        done
        printf '%s\n' "Stock M14 boot components staged; AVB not validated."
        '''

        def replace_assignment(s: str, key: str, value: str, required=True) -> str:
            pattern = rf'(?m)^[ \t]*{re.escape(key)}="[^"\n]*"[ \t]*(?:#.*)?$'
            replacement = f'{key}="{value}"'
            if re.search(pattern, s):
                return re.sub(pattern, lambda _: replacement, s, count=1)
            if required:
                raise ValueError(f"Upstream structure changed: {key} missing")
            return s.rstrip() + "\n" + replacement + "\n"

        def apply(repo: Path):
            required = [
                "build.sh", "objectives/m14x/m14x.sh",
                "scripts/utils/download_utils.sh", "scripts/unpack_fw.sh",
                "platform/m14x/kernel.sh",
            ]
            missing = [p for p in required if not (repo / p).is_file()]
            if missing:
                raise FileNotFoundError("ReCoreUI 8.5 tree missing: " + ", ".join(missing))

            config = repo / "objectives/m14x/m14x.sh"
            s = config.read_text()
            for key, value in (
                ("MODEL", "SM-A176B"), ("CSC", "TUR"),
                ("PORT_FIRMWARE", DONOR),
                ("STOCK_MODEL", "SM-M146B"), ("STOCK_CSC", "TUR"),
                ("EXTRA_MODEL", ""), ("EXTRA_CSC", ""), ("EXTRA_FIRMWARE", ""),
                ("FILESYSTEM", "erofs"),
            ):
                s = replace_assignment(s, key, value)
            s = replace_assignment(s, "STOCK_FIRMWARE", STOCK, required=False)
            config.write_text(s)

            downloader = repo / "scripts/utils/download_utils.sh"
            s = downloader.read_text()
            needle = '    elif [[ "${FW_PREFIX,,}" == "extra" ]]; then\n        REQUESTED_VERSION="$EXTRA_VERSION"'
            if "REQUESTED_VERSION=\"${STOCK_FIRMWARE:-}\"" not in s:
                if needle not in s:
                    raise ValueError("download_utils.sh: unexpected FETCH_FW structure")
                s = s.replace(needle, needle + '\n    elif [[ "${FW_PREFIX,,}" == "stock" ]]; then\n        REQUESTED_VERSION="${STOCK_FIRMWARE:-}"', 1)
            downloader.write_text(s)

            unpacker = repo / "scripts/unpack_fw.sh"
            s = unpacker.read_text()
            old = 'if IS_GITHUB_ACTIONS; then rm -f "$AP_PACKAGE" && rm -rf "$SOURCE_DIR"; fi'
            new = 'if IS_GITHUB_ACTIONS && [[ "$FW_TYPE" != "stock" ]]; then rm -f "$AP_PACKAGE" && rm -rf "$SOURCE_DIR"; fi'
            if old in s:
                s = s.replace(old, new, 1)
            elif new not in s:
                raise ValueError("unpack_fw.sh: unexpected AP cleanup structure")
            unpacker.write_text(s)

            # Avoid bundling the root manager APK. The remaining ROM must still be
            # independently audited for any other root mechanism.
            ksu_dir = repo / "platform/m14x/KernelSU-Next"
            if ksu_dir.exists():
                import shutil
                shutil.rmtree(ksu_dir)
            (repo/"platform/m14x/kernel.sh").write_text(KERNEL_SCRIPT)

            # Two-source build: the original FF script hardcodes an absent extra donor.
            ff = repo / 'recore/_device_patches/_ff/Apply-Target-Floating-Feature.sh'
            ffs = ff.read_text()
            for old, new in (
                ('GET_FF_VAL "extra" "$FEATURE"', 'GET_FF_VAL "main" "$FEATURE"'),
                ('ADD_FROM_FW "extra" "system" "etc/floating_feature.xml"',
                 'ADD_FROM_FW "main" "system" "etc/floating_feature.xml"'),
            ):
                if ffs.count(old) != 1:
                    raise ValueError('Unexpected floating feature source: '+old)
                ffs = ffs.replace(old, new, 1)
            ff.write_text(ffs)
            print('LUNA OS: floating feature donor = main A17; stock M14 values retained')

            # SDK37 v0.3: RROs originate from the main A17 donor, not EXTRA.
            rro = repo / 'recore/_device_patches/rro/rro.sh'
            rros = rro.read_text()
            for old, new in (
                ('_GET_EXTRA_PROP', '_LC_GET_MAIN_PROP'),
                ('EXTRA_ROOT', 'MAIN_ROOT'),
                ('GET_FW_DIR "extra"', 'GET_FW_DIR "main"'),
                ('EXTRA build.prop: ro.product.system.name not found',
                 'MAIN A17 build.prop: ro.product.system.name not found'),
                ('unset -f _GET_EXTRA_BUILD_PROP', 'unset -f _LC_GET_MAIN_PROP _GET_CURRENT_PROP _GET_BUILD_PROP_FROM_DIR'),
            ):
                if old not in rros:
                    raise ValueError('Unexpected RRO source: '+old)
                rros = rros.replace(old, new)
            rro.write_text(rros)
            print('LUNA OS: RRO donor = main A17; target = M14 vendor')

            # This optional flagship feature layer requires a third donor.
            # It also contains a dependent SecSettings smali patch. Omit both
            # rather than copying unrelated A17 files or forcing unsupported AI.
            import shutil
            flagship = repo / 'recore/twentysix'
            expected_flagship = {
                'Add-twentysix-Features.sh',
                'SecSettings.apk/Enable-SEAD-Toggle.smalipatch',
            }
            actual_flagship = {
                p.relative_to(flagship).as_posix()
                for p in flagship.rglob('*') if p.is_file()
            }
            if actual_flagship != expected_flagship:
                raise ValueError('Unexpected optional flagship module contents: '+repr(actual_flagship))
            shutil.rmtree(flagship)
            print('LUNA OS: optional EXTRA-dependent flagship module omitted')

            # SDK37-specific stage engine, not a donor version rename.
            (repo/'lunaos-sdk37.py').write_text(ENGINE)
            hook = repo / 'lunaos-sdk37-hook.sh'
            hook.write_text(HOOK)
            builder = repo / 'build.sh'
            bs = builder.read_text()
            def once(old,new):
                nonlocal bs
                if bs.count(old)!=1: raise ValueError('SDK37 engine anchor changed: '+old)
                bs=bs.replace(old,new,1)
            # Never overwrite shell PATH while merging metadata paths.
            once('                    PATH=$(echo "$LINE" | awk \'{print $1}\')', '                    local LC_ENTRY; LC_ENTRY=$(echo "$LINE" | awk \'{print $1}\')')
            once('                    if [[ -n "$PATH" ]]; then', '                    if [[ -n "$LC_ENTRY" ]]; then')
            once('                        sed -i "\\|^$PATH |d" "$TARGET"', '                        sed -i "\\|^$LC_ENTRY |d" "$TARGET"')
            # Preserve the actual exit code of a failed sourced patch.
            once('    if ! source "$SCRIPT_FILE"; then\n        local RC=$?', '    source "$SCRIPT_FILE" || {\n        local RC=$?')
            once('        ERROR_EXIT "Script failed in $SCRIPT_PATHS (exit $RC)"\n    fi','        ERROR_EXIT "Script failed in $SCRIPT_PATHS (exit $RC)"\n        return "$RC"\n    }')
            once('    local LAYERS=()', '    source "$RECOREUI/lunaos-sdk37-hook.sh" before || ERROR_EXIT "SDK37 donor gate failed"\n    local LAYERS=()')
            once('    REPACK_ROM "$FILESYSTEM" || ERROR_EXIT "Repack failed"','    source "$RECOREUI/lunaos-sdk37-hook.sh" after || ERROR_EXIT "SDK37 payload gate failed"\n    REPACK_ROM "$FILESYSTEM" || ERROR_EXIT "Repack failed"')
            once('ROM_VERSION="8.6"','ROM_VERSION="9.0"')
            builder.write_text(bs)
            print("CONFIGURED donor", DONOR)
            print("CONFIGURED stock", STOCK)
            print("Removed S24 FE optional donor and KernelSU-Next manager preload.")
            print("Prepared stock M14 boot chain extraction (not validated for AVB).")
            print("STATUS: EXPERIMENTAL SOURCE PATCH, NOT A VERIFIED FLASHABLE ROM.")

        def check(repo: Path):
            s=(repo/"objectives/m14x/m14x.sh").read_text()
            expected={
                "MODEL":"SM-A176B","CSC":"TUR", "STOCK_MODEL":"SM-M146B",
                "STOCK_CSC":"TUR","PORT_FIRMWARE":DONOR,"STOCK_FIRMWARE":STOCK,
                "EXTRA_MODEL":"","FILESYSTEM":"erofs"
            }
            for k,v in expected.items():
                if not re.search(rf'(?m)^{k}="{re.escape(v)}"$',s):
                    raise AssertionError(f"Incorrect {k}")
            assert not (repo/"platform/m14x/KernelSU-Next").exists(), "KernelSU preload still present"
            assert 'REQUESTED_VERSION="${STOCK_FIRMWARE:-}"' in (repo/"scripts/utils/download_utils.sh").read_text()
            assert '[[ "$FW_TYPE" != "stock" ]]' in (repo/"scripts/unpack_fw.sh").read_text()
            assert "Stock M14 AP archive missing" in (repo/"platform/m14x/kernel.sh").read_text()
            rro = (repo/"recore/_device_patches/rro/rro.sh").read_text()
            assert 'GET_FW_DIR "main"' in rro and 'GET_FW_DIR "extra"' not in rro
            assert not (repo/"recore/twentysix").exists()
            print("PASS: configuration checks; image/boot/IMS not tested")


        apply(Path("/tmp/ReCoreUI"))
        check(Path("/tmp/ReCoreUI"))
        PY_PORT
        bash -n /tmp/ReCoreUI/platform/m14x/kernel.sh
        bash -n /tmp/ReCoreUI/build.sh
        bash -n /tmp/ReCoreUI/recore/_device_patches/_ff/Apply-Target-Floating-Feature.sh
        bash -n /tmp/ReCoreUI/recore/_device_patches/rro/rro.sh
        bash -n /tmp/ReCoreUI/lunaos-sdk37-hook.sh
        python3 -m py_compile /tmp/ReCoreUI/lunaos-sdk37.py
        git -C /tmp/ReCoreUI diff --stat | tee patch-stat.txt
    - name: Isolate known unsafe legacy modifications
      run: |
        python3 - <<'PY_CLEAN'
        from pathlib import Path
        import hashlib, json, subprocess
        root=Path('/tmp/ReCoreUI')
        # Exact paths from the pinned upstream tree. Do not modify proprietary
        # firmware blobs, APEX packages, or runtime security checks.
        drop=[
            'recore/_device_patches/selinux/Remove-unsupported_entries.sh',
            'recore/_nuke_bloat/Debloat.sh',
            'recore/bt-lib/Patch-Bluetooth-library.sh',
            'recore/knox/Remove-knox-traces.sh',
            'recore/knox/knoxguard/services.jar/Fix-KnoxGuard.smalipatch',
            'recore/knox/private-share/samsungkeystoreutils.jar/Bypass-Integrity-Verification.smalipatch',
            'recore/knox/secure-folder/services.jar/Fix-Secure-Folder.smalipatch',
            'recore/knox/secure-wifi/samsungkeystoreutils.jar/Bypass-Integrity-Verification.smalipatch',
            'recore/knox/shealth/knoxsdk.jar/Fix-SHealth-App.smalipatch',
            'recore/knox/smartview/set_wlan_props.sh',
            'recore/misc/encryption/Remove-samsung-encrytion.sh',
            'recore/mods/SecSettings.apk/Disable-Font-APK-Verification.smalipatch',
            'recore/mods/SecSettings.apk/Set-Sysscope-To-Official.smalipatch',
            'recore/mods/secure_flag/services.jar/Force-Disable-Secure-Screen.smalipatch',
            'recore/mods/signature/framework.jar/Disable-Signature-Verification.smalipatch',
            'recore/mods/spoofing/spoof.sh',
            'objectives/m14x/patches/remove_fstab_avb.sh',
        ]
        for rel in drop:
            p=root/rel
            assert p.is_file() and not p.is_symlink(), 'Unexpected upstream tree: '+rel
        records={}
        for rel in drop:
            p=root/rel
            records[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
            p.unlink()
        misc=root/'recore/misc/_misc_patches.sh'
        s=misc.read_text()
        for part in ('system','vendor'):
            old=f'BPROP "{part}" "ro.adb.secure" "0"'
            assert s.count(old)==1, 'ADB patch anchor mismatch'
            s=s.replace(old,'# Preserve original ADB authentication',1)
        misc.write_text(s)
        subprocess.run(['bash','-n',str(misc)],check=True)
        assert not any((root/p).exists() for p in drop)
        Path('alpha2-source-cleanup.json').write_text(json.dumps({'status':'KNOWN_PATCHES_REMOVED_SOURCE_ONLY','removed':records,'adb_override_removed':True,'limitations':['No comprehensive security audit','No AVB or SELinux compatibility proof','No device testing','Unmodified donor security checks may expose compatibility failures']},indent=2))
        print('Known legacy changes isolated:',len(records))
        PY_CLEAN
        git -C /tmp/ReCoreUI diff --stat | tee patch-stat.txt
    - name: Install R15 integration and reference capture
      run: |
        python3 - <<'PY_R15_INSTALL'
        from pathlib import Path
        import base64,hashlib,ast
        root=Path('/tmp/ReCoreUI')
        code=base64.b64decode('').decode()
        compile(code,'lunaos-r15.py','exec')
        (root/'lunaos-r15.py').write_text(code)
        tree=ast.parse(code)
        for node in tree.body:
            if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='PAYLOAD' for t in node.targets):
                payload=ast.literal_eval(node.value)
        assert len(payload)==3
        for name,(encoded,digest) in payload.items():
            assert hashlib.sha256(base64.b64decode(encoded)).hexdigest()==digest
            print(name,digest)
        p=root/'build.sh'
        s=p.read_text()
        anchor='    REPACK_ROM "$FILESYSTEM" || ERROR_EXIT "Repack failed"'
        assert s.count(anchor)==1
        hook='    python3 "$RECOREUI/lunaos-r15.py" "$(GET_PARTITION_PATH system)" "$RECOREUI" "$WORKSPACE" || ERROR_EXIT "R15 integration failed"\n'
        p.write_text(s.replace(anchor,hook+anchor,1))
        PY_R15_INSTALL
        bash -n /tmp/ReCoreUI/build.sh
        python3 -m py_compile /tmp/ReCoreUI/lunaos-r15.py
        git -C /tmp/ReCoreUI diff --stat | tee patch-stat.txt
    - name: Install R17 brightness and final VINTF hook
      run: |
        python3 - <<'PY_R17'
        from pathlib import Path
        import base64,hashlib
        root=Path('/tmp/ReCoreUI')
        b=base64.b64decode(''); assert hashlib.sha256(b).hexdigest()=='656efc2a9d2c5d21fe997570fb863c8dcfd14ca1638e985cad335bb4a593611c'; (root/'luna-brightness.py').write_bytes(b)
        b=base64.b64decode(''); assert hashlib.sha256(b).hexdigest()=='cf1b92b5d47573fd0e6126f2293463ff25e86b9b9f5aec1b04d26302e4de1f06'; (root/'luna-ota.py').write_bytes(b)
        b=base64.b64decode(''); assert hashlib.sha256(b).hexdigest()=='4735df5904a7883a97795d30738d790b0c40e4428d7e524fe3af27ad9e7a9f65'; (root/'luna-source-status.json').write_bytes(b)
        b=base64.b64decode(''); assert hashlib.sha256(b).hexdigest()=='8f180bfd8ae015398aff3bae782e22e5390dd3fb7c8ee4473e3d95d92d945c3f'; (root/'luna-r17-hook.sh').write_bytes(b)
        p=root/'build.sh';s=p.read_text();a='    REPACK_ROM "$FILESYSTEM" || ERROR_EXIT "Repack failed"'
        assert s.count(a)==1
        h='    bash "$RECOREUI/luna-r17-hook.sh" "$(GET_PARTITION_PATH system)" "$(GET_PARTITION_PATH product)" "$(GET_PARTITION_PATH vendor)" "$(GET_PARTITION_PATH odm)" "$(GET_PARTITION_PATH system_ext)" "$RECOREUI" || { ERROR_EXIT "R17 brightness or VINTF gate failed"; return 1; }\n'
        p.write_text(s.replace(a,h+a,1))
        PY_R17
        bash -n /tmp/ReCoreUI/build.sh
        bash -n /tmp/ReCoreUI/luna-r17-hook.sh
        python3 -m py_compile /tmp/ReCoreUI/luna-brightness.py /tmp/ReCoreUI/luna-ota.py
    - name: Preflight pinned host tools and signing utilities
      run: |
        set -euo pipefail
        mkdir -p /tmp/luna-r17-tools/sdk /tmp/luna-r17-reports
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        bt="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        [[ -n "$bt" && -x "$bt/aapt2" && -x "$bt/apksigner" && -x "$bt/zipalign" ]]
        cp -a "$bt/." /tmp/luna-r17-tools/sdk/
        /tmp/luna-r17-tools/sdk/aapt2 version
        /tmp/luna-r17-tools/sdk/apksigner version
        command -v keytool
        python3 - <<'PY_TOOLS'
        import urllib.request,zipfile,hashlib,stat,shutil
        from pathlib import Path
        root=Path('/tmp/luna-r17-tools'); out=root/'host'; out.mkdir()
        url='https://ci.android.com/builds/submitted/16968706/aosp_cf_arm64_only_phone-userdebug/latest/raw/otatools.zip'
        archive=root/'otatools.zip'; cap=1536*1024**2
        with urllib.request.urlopen(url,timeout=90) as f,archive.open('wb') as g:
            n=0
            for chunk in iter(lambda:f.read(1024*1024),b''):
                n+=len(chunk); assert n<=cap,'Host tools archive exceeds limit';g.write(chunk)
        with archive.open('rb') as f: h=hashlib.file_digest(f,'sha256').hexdigest()
        assert h=='7d76d1c144c1cbe86fe920f1a64c59a964322f609de2d96b2e9cb4739c95f45d','Pinned R10 archive hash mismatch'
        needed={'checkvintf','apexd_host','deapexer','debugfs_static','debugfs','fsck.erofs','blkid','apex_compression_tool','dump_apex_info','idmap2'}
        with zipfile.ZipFile(archive) as z:
            selected=[i for i in z.infolist() if i.filename in {'bin/'+x for x in needed} or i.filename.startswith(('lib64/','lib/','etc/'))]
            assert sum(i.file_size for i in selected)<3*2**30
            for i in selected:
                assert (out/i.filename).resolve().is_relative_to(out.resolve()) and not stat.S_ISLNK(i.external_attr>>16)
                z.extract(i,out)
            for name in needed:
                p=out/'bin'/name
                if p.is_file(): p.chmod(0o755)
        for name in ['checkvintf','apexd_host','deapexer','idmap2']:
            assert (out/'bin'/name).is_file(), 'Missing required host tool: '+name+'; stop before firmware download'
        archive.unlink()
        Path('/tmp/luna-r17-reports/host-tools.txt').write_text(url+'\nSHA256='+h+'\nSDK37 tool provenance not independently established\n')
        PY_TOOLS
        export LD_LIBRARY_PATH=/tmp/luna-r17-tools/host/lib64:/tmp/luna-r17-tools/host/lib
        export PATH=/tmp/luna-r17-tools/host/bin:$PATH
        # Help exit codes vary; verify the binaries actually start, not just file presence.
        for cmd in 'idmap2' 'checkvintf' 'apexd_host'; do
          set +e; "$cmd" --help > "/tmp/luna-r17-reports/$cmd-help.txt" 2>&1; rc=$?; set -e
          [[ "$rc" -lt 126 ]] || exit 1
          ! grep -qi 'error while loading shared libraries' "/tmp/luna-r17-reports/$cmd-help.txt"
        done
    - name: Write build scope
      run: |
        cat > status.txt <<'EOF'
        R17+R18+OTA guarded laboratory candidate; NOT FLASHABLE
        A176BXXU8DZJ5 -> M146BXXSFDZI1.
        R15 QMG and VINTF payload retained. New overlay requires signature and enforced idmap host test.
        SSRM cause unresolved; do not change thermal protections. Samsung AVB trust and recovery installer unresolved.
        No OTA publication, no automatic flash, no release approval.
        EOF
    - name: Free runner storage
      if: inputs.mode == 'build'
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker system prune -af || true
        df -h /
    - name: Build LUNA OS A17 experimental system
      if: inputs.mode == 'build'
      run: |
        cd /tmp/ReCoreUI
        set -o pipefail
        sudo bash build.sh --build m14x 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
    - name: Read back six EROFS partitions
      if: inputs.mode == 'build'
      run: |
        set -euo pipefail
        python3 - <<'PY_VERIFY'
        import zipfile,shutil,subprocess,hashlib,json,tempfile,os
        from pathlib import Path
        root=Path('/tmp/ReCoreUI');R=Path('/tmp/luna-r17-reports');zips=list((root/'out').glob('*.zip'));assert len(zips)==1
        with tempfile.TemporaryDirectory(prefix='luna-final-') as td:
            t=Path(td); imgs=t/'images';imgs.mkdir(); super=t/'super.img'
            with zipfile.ZipFile(zips[0]) as z:
                i=z.getinfo('super.img'); assert i.file_size<=8287944704
                assert shutil.disk_usage(t).free>i.file_size+7*2**30,'Insufficient local space for readback; stop without delivery'
                with z.open(i) as f,super.open('wb') as g:shutil.copyfileobj(f,g,8*1024*1024)
            tools=root/'prebuilts/android-tools';fsck=root/'prebuilts/erofs-utils/fsck.erofs'
            def run(cmd,name):
                with (R/name).open('w') as f:subprocess.run(list(map(str,cmd)),stdout=f,stderr=subprocess.STDOUT,check=True,timeout=1800)
            run([tools/'lpdump',super],'final-lpdump.txt');run([tools/'lpunpack',super,imgs],'final-lpunpack.txt')
            records={}
            for name in ('system','product','vendor','odm','system_dlkm','vendor_dlkm'):
                p=imgs/(name+'.img');assert p.is_file(),name
                run([fsck,p],'final-fsck-'+name+'.txt')
                with p.open('rb') as f: h=hashlib.file_digest(f,'sha256').hexdigest()
                records[name]={'size':p.stat().st_size,'sha256':h}
            (R/'final-erofs.json').write_text(json.dumps(records,indent=2))
        PY_VERIFY
    - name: Audit and isolate laboratory super image
      if: inputs.mode == 'build'
      run: |
        python3 - <<'PY_AUDIT'
        import hashlib, json, os, zipfile, shutil
        from pathlib import Path
        root=Path('/tmp/ReCoreUI')
        work=Path(os.environ['GITHUB_WORKSPACE'])
        state=Path('/tmp/lunaos-sdk37-state')
        log=(work/'build.log').read_text(errors='replace')
        forbidden=('Applying Disable-Signature-Verification.smalipatch','Applying Bypass-Integrity-Verification.smalipatch','Applying Fix-KnoxGuard.smalipatch','Applying Force-Disable-Secure-Screen.smalipatch','Removing Samsung Encryption','Removing AVB flags from fstab','Applying Remove-knox-traces.sh')
        assert not any(x in log for x in forbidden), 'Legacy security modification logged; delivery blocked'
        gate=json.loads((state/'after.json').read_text())
        integration=json.loads(Path('/tmp/lunaos-r15-state/integration.json').read_text())
        assert integration['status']=='WORKSPACE_PATCHED_NOT_FLASHABLE' and len(integration['patches'])==3
        assert gate['status']=='SDK37_STAGE_GUARD_PASS_NOT_DEVICE_VALIDATED', gate
        roms=sorted((root/'out').glob('*.zip'))
        assert len(roms)==1, f'Expected one upstream build output, found {roms}'
        target=work/'LUNA_OS_9_A17_R17_R18_LAB_NOT_FLASHABLE.zip'
        report={'status':'LAB_NOT_FLASHABLE','source_zip':roms[0].name,'images':{},'limitations':['No device testing','AVB and VINTF not validated','No installer or boot-chain payload delivered','IMS, NFC, BT, display and rootlessness not validated']}
        def digest(f):
            h=hashlib.sha256(); n=0
            for b in iter(lambda:f.read(8*1024*1024),b''):
                h.update(b); n+=len(b)
            return n,h.hexdigest()
        with zipfile.ZipFile(roms[0]) as src:
            names=src.namelist(); assert len(names)==len(set(names)), 'Duplicate ZIP entries'
            for i in src.infolist():
                if '/' not in i.filename and i.filename.endswith('.img'):
                    with src.open(i) as f: n,h=digest(f)
                    assert n==i.file_size
                    report['images'][i.filename]={'size':n,'sha256':h}
            super_info=src.getinfo('super.img')
            assert 0<super_info.file_size<=8287944704, 'Super exceeds previous known M14 capacity'
            with src.open(super_info) as f:
                assert f.read(4)!=bytes.fromhex('3aff26ed'), 'Sparse super needs separate validation'
            if os.environ.get('LAB_DELIVERY')=='gofile':
                assert shutil.disk_usage(work).free>super_info.file_size+512*1024**2, 'Not enough free space for lab archive'
                with zipfile.ZipFile(target,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=1,allowZip64=True) as dst:
                    with src.open(super_info) as a,dst.open('super.img','w',force_zip64=True) as b:
                        shutil.copyfileobj(a,b,8*1024*1024)
                    dst.writestr('README_NOT_FLASHABLE.txt','Laboratory image for offline inspection only. No recovery installer. Do not flash.\n')
                    dst.write(root/'LICENSE','UPSTREAM-LICENSE.txt')
                with zipfile.ZipFile(target) as z:
                    with z.open('super.img') as f: n,h=digest(f)
                    assert {'size':n,'sha256':h}==report['images']['super.img']
                with target.open('rb') as f: n,h=digest(f)
                report['archive']={'name':target.name,'size':n,'sha256':h}
        (work/'LUNA_OS_A17_Build_Result.json').write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        PY_AUDIT
      env:
        LAB_DELIVERY: ${{ inputs.delivery }}
    - name: Create blocked OTA candidate metadata
      if: inputs.mode == 'build'
      env:
        LUNA_OTA_ED25519_KEY: ${{ secrets.LUNA_OTA_ED25519_KEY }}
      run: |
        set -euo pipefail
        R=/tmp/luna-r17-reports
        python3 - <<'PY_OTA'
        import json,os
        from pathlib import Path
        R=Path('/tmp/luna-r17-reports');b=json.loads(Path('LUNA_OS_A17_Build_Result.json').read_text())
        d={'schema':1,'project':'LUNA OS','device':'SM-M146B','codename':'m14x','base_firmware':'M146BXXSFDZI1','android_sdk':37,'channel':'alpha','version':'9.0 ALPHA 3 R17-R18','build':int(os.environ['GITHUB_RUN_NUMBER']),'release_status':'blocked_lab_candidate','install_allowed':False,'automatic_install':False,'super':b['images']['super.img'],'package':b.get('archive'),'blockers':['SSRM runtime cause unresolved','Samsung AVB trust/FEC unresolved','TWRP installer not validated','Device runtime and rootlessness not validated'],'changelog':['M14 brightness overlay lab candidate','13 HAL VINTF matrix','LUNA OS QMG assets']}
        (R/'ota-candidate.json').write_text(json.dumps(d,indent=2)+'\n')
        PY_OTA
        # Never publish a lab artifact as a usable OTA. Signing is optional and does not alter install_allowed.
        if [[ -n "${LUNA_OTA_ED25519_KEY:-}" ]]; then
          umask 077; key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LUNA_OTA_ED25519_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$R/ota-candidate.json" -out "$R/ota-candidate.json.sig"
          openssl pkey -in "$key" -pubout > "$R/ota-public.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$R/ota-public.pem" -in "$R/ota-candidate.json" -sigfile "$R/ota-candidate.json.sig"
        fi
    - name: Deliver lab archive to GoFile
      if: inputs.mode == 'build' && inputs.delivery == 'gofile'
      env:
        GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}
      run: |
        bash "$RUNNER_TEMP/lumacore-gofile-upload.sh" LUNA_OS_9_A17_R17_R18_LAB_NOT_FLASHABLE.zip upload-status.txt
    - name: Collect diagnostic reports
      if: always()
      run: |
        cp /tmp/lunaos-r15-state/integration.json r15-integration.json 2>/dev/null || true
        cp /tmp/lunaos-r15-state/display-thermal-references.zip r15-display-thermal-references.zip 2>/dev/null || true
        cp /tmp/lunaos-sdk37-state/before.json sdk37-before.json 2>/dev/null || true
        cp /tmp/lunaos-sdk37-state/after.json sdk37-after.json 2>/dev/null || true
        find /tmp/ReCoreUI/out -maxdepth 2 -type f -printf '%P\t%s bytes\n' 2>/dev/null > output-files.txt || true
        mkdir -p r17-reports
        cp -a /tmp/luna-r17-reports/. r17-reports/ 2>/dev/null || true
    - name: Upload small build report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LUNA-OS-R17-R18-OTA-build-result
        path: |
          status.txt
          upstream-commit.txt
          upstream-LICENSE.txt
          patch-stat.txt
          alpha2-source-cleanup.json
          build.log
          r15-integration.json
          r15-display-thermal-references.zip
          sdk37-before.json
          sdk37-after.json
          output-files.txt
          upload-status.txt
          LUNA_OS_A17_Build_Result.json
          r17-reports/
        if-no-files-found: warn
        retention-days: 7
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight validates tools before firmware downloads; build creates a non-flashable candidate
        type: choice
        required: true
        default: preflight
        options:
        - preflight
        - build
      delivery:
        description: Report only (recommended), or upload non-flashable lab archive
        required: true
        type: choice
        default: report_only
        options:
        - gofile
        - report_only
